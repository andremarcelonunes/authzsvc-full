  # ===== ADMIN POLICY MANAGEMENT ENDPOINTS =====
  /admin/policies:
    get:
      tags: [Admin - Policies]
      summary: List all Casbin policies
      description: |
        Retrieve all authorization policies in the system.
        
        **Admin only endpoint**
        
        **Policy format**: `[subject, object, action, validation_rule]`
        
        **Policy types**:
        - **Role policies**: `role_user`, `role_admin`
        - **Path patterns**: `/api/users/*`, `/admin/*`
        - **HTTP methods**: `GET`, `POST`, `(GET|POST)`
        - **Validation rules**: `path.id==token.user_id`, `*`
      operationId: listPolicies
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Policies retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  items:
                    type: string
                  minItems: 3
                  maxItems: 4
                  description: Policy array [subject, object, action, rule]
              examples:
                policies_list:
                  summary: Current policies
                  value:
                    - ["role_admin", "/admin/*", "*", "*"]
                    - ["role_user", "/auth/me", "GET", "*"]
                    - ["role_user", "/auth/logout", "POST", "*"]
                    - ["role_user", "/users/:id", "GET", "path.id==token.user_id"]
                    - ["role_user", "/users/:id", "PUT", "path.id==token.user_id"]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Admin - Policies]
      summary: Add new Casbin policy
      description: |
        Add a new authorization policy to the system.
        
        **Admin only endpoint**
        
        **Policy components**:
        - **Subject**: Role (e.g., `role_user`, `role_admin`)
        - **Object**: Resource path with wildcards (e.g., `/api/posts/*`)
        - **Action**: HTTP method or pattern (e.g., `GET`, `(GET|POST)`)
        - **Rule**: Field validation (optional, e.g., `path.id==token.user_id`)
        
        **Examples**:
        - Basic permission: `role_user, /profile, GET, *`
        - Ownership validation: `role_user, /users/:id, GET, path.id==token.user_id`
        - Admin access: `role_admin, /admin/*, *, *`
      operationId: addPolicy
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyRequest'
            examples:
              basic_policy:
                summary: Basic user permission
                value:
                  subject: "role_user"
                  object: "/api/posts"
                  action: "GET"
                  rule: "*"
              ownership_policy:
                summary: Ownership validation
                value:
                  subject: "role_user"
                  object: "/api/posts/:id"
                  action: "PUT"
                  rule: "path.id==token.user_id"
              admin_policy:
                summary: Admin wildcard access
                value:
                  subject: "role_admin"
                  object: "/api/analytics/*"
                  action: "(GET|POST)"
                  rule: "*"
              query_validation:
                summary: Query parameter validation
                value:
                  subject: "role_user"
                  object: "/api/orders/*"
                  action: "GET"
                  rule: "query.user_id==token.user_id"
      responses:
        '204':
          description: Policy added successfully
        '400':
          description: Invalid policy or validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                empty_fields:
                  summary: Empty required fields
                  value:
                    error: "subject, object, and action cannot be empty"
                    code: 400
                    timestamp: "2024-01-15T10:30:00Z"
                not_added:
                  summary: Policy not added (duplicate or invalid)
                  value:
                    error: "not added"
                    code: 400
                    timestamp: "2024-01-15T10:30:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Admin - Policies]
      summary: Remove Casbin policy
      description: |
        Remove an existing authorization policy from the system.
        
        **Admin only endpoint**
        
        **Requirements**:
        - All policy components must match exactly
        - Include rule field if the policy has one
        - Policy must exist in the system
        
        **Caution**: Removing policies can affect user access immediately
      operationId: removePolicy
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyRequest'
            examples:
              remove_basic:
                summary: Remove basic policy
                value:
                  subject: "role_user"
                  object: "/api/deprecated"
                  action: "GET"
              remove_with_rule:
                summary: Remove policy with validation rule
                value:
                  subject: "role_user"
                  object: "/api/posts/:id"
                  action: "DELETE"
                  rule: "path.id==token.user_id"
      responses:
        '204':
          description: Policy removed successfully
        '400':
          description: Invalid policy or removal failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                empty_fields:
                  summary: Empty required fields
                  value:
                    error: "subject, object, and action cannot be empty"
                    code: 400
                    timestamp: "2024-01-15T10:30:00Z"
                not_removed:
                  summary: Policy not removed (not found)
                  value:
                    error: "not removed"
                    code: 400
                    timestamp: "2024-01-15T10:30:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===== EXTERNAL AUTHORIZATION ENDPOINTS =====
  /external/authz:
    post:
      tags: [External Authorization]
      summary: Envoy external authorization
      description: |
        **Envoy Proxy External Authorization endpoint**
        
        This endpoint is called by Envoy Proxy to authorize requests before forwarding to backend services.
        
        **Process**:
        1. **JWT validation**: Verify access token from Authorization header
        2. **Session check**: Ensure session exists in Redis
        3. **Policy evaluation**: Check Casbin policies for permission
        4. **Field validation**: Validate request data against token claims
        
        **Request format**: Envoy ext_authz request structure
        
        **Response**:
        - `200 OK`: Request authorized, forward to backend
        - `401/403`: Request denied, return error to client
        
        **Headers added to backend requests**:
        - `x-user-id`: User ID from token
        - `x-user-role`: User role from token
        - `x-session-id`: Session ID from token
        
        **Field validation examples**:
        - `path.id==token.user_id`: User can only access their own data
        - `query.tenant==token.tenant`: Multi-tenant access control
        - `body.owner_id==token.user_id`: Resource ownership validation
      operationId: externalAuthorize
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvoyAuthzRequest'
            examples:
              valid_request:
                summary: Valid user request
                value:
                  attributes:
                    request:
                      http:
                        method: "GET"
                        path: "/users/123"
                        headers:
                          authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                        query: ""
                    source:
                      address:
                        socketAddress:
                          address: "192.168.1.100"
                          portValue: 54321
              admin_request:
                summary: Admin request
                value:
                  attributes:
                    request:
                      http:
                        method: "POST"
                        path: "/admin/policies"
                        headers:
                          authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                          content-type: "application/json"
                        body: "eyJzdWJqZWN0IjoicGF0aF9pZCIsIm9iamVjdCI6IlVTRVIifQ=="
              field_validation_request:
                summary: Request with field validation
                value:
                  attributes:
                    request:
                      http:
                        method: "PUT"
                        path: "/users/123"
                        headers:
                          authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                        body: "eyJ1c2VyX2lkIjoxMjMsIm5hbWUiOiJKb2huIERvZSJ9"
      responses:
        '200':
          description: Request authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvoyAuthzResponse'
              examples:
                authorized:
                  summary: Authorization successful
                  value:
                    status:
                      code: 200
                    headers:
                      x-user-id: "123"
                      x-user-role: "user"
                      x-session-id: "sess_abc123"
        '400':
          description: Invalid request format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid request format"
                details: "Missing required fields in request"
                code: 400
                timestamp: "2024-01-15T10:30:00Z"
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvoyAuthzResponse'
              examples:
                no_auth_header:
                  summary: Missing authorization header
                  value:
                    status:
                      code: 401
                    body: '{"error": "Authorization header required"}'
                invalid_token:
                  summary: Invalid or expired token
                  value:
                    status:
                      code: 401
                    body: '{"error": "Invalid token"}'
                session_invalid:
                  summary: Session invalid or expired
                  value:
                    status:
                      code: 401
                    body: '{"error": "Session invalid or expired"}'
        '403':
          description: Authorization failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvoyAuthzResponse'
              examples:
                access_denied:
                  summary: Access denied by policy
                  value:
                    status:
                      code: 403
                    body: '{"error": "Access denied"}'
                field_validation_failed:
                  summary: Field validation failed
                  value:
                    status:
                      code: 403
                    body: '{"error": "Field validation failed: Request values do not match token claims"}'
        '500':
          description: Authorization check failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                authz_failed:
                  summary: Authorization check failed
                  value:
                    error: "Authorization check failed"
                    details: "Internal error during policy evaluation"
                    code: 500
                    timestamp: "2024-01-15T10:30:00Z"
                field_validation_error:
                  summary: Field validation error
                  value:
                    error: "Field validation failed"
                    details: "Error extracting field values"
                    code: 500
                    timestamp: "2024-01-15T10:30:00Z"

  /external/health:
    get:
      tags: [External Authorization]
      summary: External authorization health check
      description: |
        Health check endpoint for external authorization service.
        
        Used by Envoy Proxy and monitoring systems to verify the external authorization service is operational.
      operationId: externalHealth
      responses:
        '200':
          description: External authorization service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  service:
                    type: string
                    example: "external-authz"
                  version:
                    type: string
                    example: "1.0.0"
              example:
                status: "healthy"
                service: "external-authz"
                version: "1.0.0"

  # ===== USER DATA ENDPOINT (DEMO) =====
  /users/{id}:
    get:
      tags: [User Management]
      summary: Get user data (field validation demo)
      description: |
        **Demo endpoint for field validation**
        
        This endpoint demonstrates SimpleCasbinMW field validation where users can only access their own data.
        
        **Policy**: `role_user, /users/:id, GET, path.id==token.user_id`
        
        **Behavior**:
        - ✅ User ID 123 can access `/users/123`
        - ❌ User ID 123 cannot access `/users/456`
        - ✅ Admin can access any user data
        
        **Response**: Simplified user information for demonstration
      operationId: getUserData
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID to retrieve
          schema:
            type: integer
            example: 123
      responses:
        '200':
          description: User data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User data access successful"
                  requested_user_id:
                    type: string
                    example: "123"
                  current_user_id:
                    type: integer
                    example: 123
                  note:
                    type: string
                    example: "This endpoint demonstrates SimpleCasbinMW field validation"
              examples:
                own_data:
                  summary: User accessing own data
                  value:
                    message: "User data access successful"
                    requested_user_id: "123"
                    current_user_id: 123
                    note: "This endpoint demonstrates SimpleCasbinMW field validation"
                admin_access:
                  summary: Admin accessing any user data
                  value:
                    message: "User data access successful"
                    requested_user_id: "456"
                    current_user_id: 2
                    note: "This endpoint demonstrates SimpleCasbinMW field validation"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Field validation failed - cannot access other user's data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Field validation failed"
                message: "path.id (456) does not match token.user_id (123)"
                code: 403
                timestamp: "2024-01-15T10:30:00Z"
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===== LGPD USER DELETION ENDPOINTS =====
  /users/me/deletion:
    post:
      tags: [User Management]
      summary: Request account deletion (LGPD compliant)
      description: |
        Request deletion, anonymization, or deactivation of user account per **LGPD Article 18, VI** (Right to deletion).
        
        **LGPD Compliance Features**:
        - 30-day grace period for cancellation
        - Multiple deletion types (full, soft, anonymization, deactivation)
        - Comprehensive audit logging
        - Legal retention compliance checking
        
        **Deletion Types**:
        - `full_delete`: Complete removal from database
        - `soft_delete`: Logical deletion with retention
        - `anonymization`: Personal data anonymization
        - `deactivation`: Account deactivation only
        - `export_delete`: Data export then deletion
        
        **Process**:
        1. Request created with 30-day grace period
        2. User can cancel within grace period
        3. After grace period, deletion is processed
        4. All related data cascade deleted/anonymized
        
        **Rate limiting**: 3 requests per day per user
      operationId: requestDeletion
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestDeletionRequest'
            examples:
              full_deletion:
                summary: Request full account deletion
                value:
                  deletion_type: "full_delete"
                  reason: "I no longer wish to use this service and want all my data permanently deleted"
                  confirm: true
              anonymization:
                summary: Request data anonymization
                value:
                  deletion_type: "anonymization"
                  reason: "Please anonymize my personal data while keeping account functionality"
                  confirm: true
              deactivation:
                summary: Request account deactivation
                value:
                  deletion_type: "deactivation"
                  reason: "Temporarily deactivate my account but keep my data"
                  confirm: true
      responses:
        '201':
          description: Deletion request created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DeletionRequestResponse'
              examples:
                deletion_requested:
                  summary: Deletion request created
                  value:
                    data:
                      request_id: "123e4567-e89b-12d3-a456-426614174000"
                      status: "pending"
                      type: "full_delete"
                      scheduled_for: "2024-02-15T10:30:00Z"
                      retention_required: false
                      message: "Deletion request created. You have 30 days to cancel this request."
                      lgpd_rights:
                        article: "Article 18, VI"
                        description: "Right to deletion of personal data"
        '400':
          description: Invalid request or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_confirmation:
                  summary: Missing explicit confirmation
                  value:
                    error: "deletion must be explicitly confirmed"
                    hint: "Set 'confirm' to true to proceed"
                    code: 400
                    timestamp: "2024-01-15T10:30:00Z"
                invalid_type:
                  summary: Invalid deletion type
                  value:
                    error: "invalid deletion type"
                    code: 400
                    timestamp: "2024-01-15T10:30:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Deletion blocked for legal reasons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                legal_hold:
                  summary: Deletion blocked by legal hold
                  value:
                    error: "deletion_blocked"
                    message: "Account deletion blocked due to ongoing legal proceedings"
                    lgpd_article: "Article 16 - Data retention for legal compliance"
                    code: 403
                    timestamp: "2024-01-15T10:30:00Z"
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/me/deletion/{id}:
    get:
      tags: [User Management]
      summary: Check deletion request status
      description: |
        Get the current status of a deletion request.
        
        **Status Values**:
        - `pending`: Request created, within grace period
        - `scheduled`: Grace period ended, scheduled for processing
        - `processing`: Currently being processed
        - `completed`: Deletion completed
        - `cancelled`: Request cancelled by user
        - `failed`: Processing failed (manual intervention required)
        
        **Retention Information**:
        - Shows if retention is required for legal compliance
        - Provides retention reason and estimated duration
      operationId: getDeletionStatus
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Deletion request ID (UUID)
          schema:
            type: string
            format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '200':
          description: Deletion request status retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DeletionStatusResponse'
              examples:
                pending_request:
                  summary: Pending deletion request
                  value:
                    data:
                      request_id: "123e4567-e89b-12d3-a456-426614174000"
                      status: "pending"
                      type: "full_delete"
                      requested_at: "2024-01-15T10:30:00Z"
                      scheduled_for: "2024-02-15T10:30:00Z"
                      processed_at: null
                      completed_at: null
                      retention_required: false
                      retention_reason: null
                completed_request:
                  summary: Completed deletion
                  value:
                    data:
                      request_id: "123e4567-e89b-12d3-a456-426614174000"
                      status: "completed"
                      type: "anonymization"
                      requested_at: "2024-01-15T10:30:00Z"
                      scheduled_for: "2024-02-15T10:30:00Z"
                      processed_at: "2024-02-15T10:35:00Z"
                      completed_at: "2024-02-15T10:36:00Z"
                      retention_required: true
                      retention_reason: "Financial records retention - 7 years"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Access denied - request belongs to different user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "access denied"
                code: 403
                timestamp: "2024-01-15T10:30:00Z"
        '404':
          description: Deletion request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "deletion request not found"
                code: 404
                timestamp: "2024-01-15T10:30:00Z"
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [User Management]
      summary: Cancel deletion request
      description: |
        Cancel a pending deletion request within the grace period.
        
        **Requirements**:
        - Request must be in `pending` status
        - Must be within 30-day grace period
        - User must own the request
        
        **After Cancellation**:
        - Request status changes to `cancelled`
        - Scheduled deletion is removed
        - User account remains active
        - Audit log entry created
      operationId: cancelDeletion
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Deletion request ID (UUID)
          schema:
            type: string
            format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '200':
          description: Deletion request cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      request_id:
                        type: string
                        format: uuid
              examples:
                cancellation_success:
                  summary: Request cancelled successfully
                  value:
                    data:
                      message: "Deletion request cancelled successfully"
                      request_id: "123e4567-e89b-12d3-a456-426614174000"
        '400':
          description: Cannot cancel deletion request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                already_processed:
                  summary: Request already processed
                  value:
                    error: "cannot cancel deletion"
                    details: "Request has already been processed"
                    code: 400
                    timestamp: "2024-01-15T10:30:00Z"
                grace_period_expired:
                  summary: Grace period expired
                  value:
                    error: "cannot cancel deletion"
                    details: "Grace period has expired, request is scheduled for processing"
                    code: 400
                    timestamp: "2024-01-15T10:30:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Access denied - request belongs to different user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "access denied"
                code: 403
                timestamp: "2024-01-15T10:30:00Z"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/me/export:
    post:
      tags: [User Management]
      summary: Export user data (LGPD data portability)
      description: |
        Export all user data in machine-readable format per **LGPD Article 18, V** (Right to data portability).
        
        **Export Includes**:
        - Personal information (name, email, phone)
        - Account settings and preferences
        - Authentication history
        - Password change history
        - Deletion request history
        - All associated metadata
        
        **Security Features**:
        - Encrypted export files
        - SHA-256 checksums for integrity
        - Time-limited download URLs (24 hours)
        - Audit logging of export requests
        
        **Supported Formats**:
        - `json`: Structured JSON format
        - `csv`: Comma-separated values
        - `xml`: XML format with schema
        
        **Rate limiting**: 1 export per day per user
      operationId: exportUserData
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportDataRequest'
            examples:
              json_export:
                summary: Export data as JSON
                value:
                  format: "json"
              csv_export:
                summary: Export data as CSV
                value:
                  format: "csv"
              xml_export:
                summary: Export data as XML
                value:
                  format: "xml"
      responses:
        '201':
          description: Export created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
