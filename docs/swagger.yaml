                    type: string
                    example: "ok"
                  timestamp:
                    type: string
                    format: date-time
                    example: "2024-01-15T10:30:00Z"
                  version:
                    type: string
                    example: "1.0.0"
                  uptime:
                    type: string
                    example: "2h15m30s"
              examples:
                healthy:
                  summary: Service healthy
                  value:
                    ok: true
                    status: "ok"
                    timestamp: "2024-01-15T10:30:00Z"
                    version: "1.0.0"
                    uptime: "2h15m30s"
        '503':
          description: Service unhealthy
