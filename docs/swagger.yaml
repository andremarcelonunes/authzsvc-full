                      status:
                        type: string
                        description: Request status
                        example: "initiated"
                      message:
                        type: string
                        description: Success message
                        example: "If this email and phone combination exists, an OTP has been sent."
                      expires_at:
                        type: string
                        format: date-time
                        description: Request expiration time
                        example: "2024-01-15T10:35:00Z"
