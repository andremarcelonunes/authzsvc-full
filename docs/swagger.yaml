      tags: [Admin - Policies]
      summary: Process pending deletion request (Admin)
      description: |
        Manually trigger processing of a scheduled deletion request.
        
        **Admin Privileges Required**:
        - Must have admin role
        - Can override grace periods in exceptional circumstances
        - Can process requests that failed automatic processing
        
        **Processing Actions**:
        - Validates legal requirements
        - Performs cascade deletion of related data
        - Creates anonymization logs
        - Updates audit trails
        - Notifies compliance systems
        
        **Use Cases**:
        - Manual processing of failed automatic deletions
        - Emergency deletions for legal compliance
        - Processing requests outside normal schedule
      operationId: adminProcessDeletion
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Deletion request ID (UUID)
          schema:
            type: string
            format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '200':
          description: Deletion request processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      request_id:
                        type: string
                        format: uuid
              examples:
                processing_started:
                  summary: Manual processing initiated
                  value:
                    data:
                      message: "Deletion request processed successfully"
                      request_id: "123e4567-e89b-12d3-a456-426614174000"
        '400':
