openapi: 3.0.3
info:
  title: AuthzSvc - Enterprise Authentication & Authorization Service
  description: |
    **Production-ready authentication and authorization service** built with Clean Architecture and Hexagonal Pattern principles.
    
    ## Features
    - **JWT-based authentication** with access/refresh token rotation
    - **SMS OTP verification** via Twilio with rate limiting
    - **Role-Based Access Control (RBAC)** with Casbin policy engine
    - **Field-level authorization** with dynamic validation rules
    - **Envoy Proxy integration** for external authorization
    - **Session management** with Redis-based distributed storage
    - **95%+ test coverage** with comprehensive security features
    
    ## Authentication Flow (CB-194 Enhanced)
    1. **Register** user with email/phone
    2. **Verify phone** via SMS OTP
    3. **Login with email OR phone** to get JWT tokens (unified authentication)
    4. **Use access token** for API calls
    5. **Refresh tokens** when expired
    
    ## CB-194: Dual Authentication
    - **Smart detection**: Automatically detects email vs phone input
    - **Unified endpoint**: Single `/auth/login` endpoint for both email and phone
    - **E.164 normalization**: International phone numbers normalized
    - **Backward compatible**: Existing email-only authentication still works
    
    ## Authorization System
    - **Role inheritance**: admin inherits user permissions
    - **Field validation**: `path.id==token.user_id` ensures ownership
    - **Wildcard patterns**: `/api/users/*` for flexible routing
    - **Runtime policy management** via admin endpoints
    
    ## Security
    - **bcrypt password hashing** (configurable cost)
    - **JWT session validation** with Redis
    - **Rate limiting** on sensitive endpoints
    - **Input validation** and SQL injection prevention
    - **HTTPS/TLS enforcement** in production
    
    ## External Authorization
    Native **Envoy Proxy** support for zero-trust microservices architecture.
    All requests validated before reaching backend services.
    
    ---
    
    **Built with Go 1.22+, Clean Architecture, SOLID principles, and enterprise-grade security.**
  version: 1.0.0
  contact:
    name: AuthzSvc Team
    email: support@authzsvc.com
    url: https://github.com/your-org/authzsvc
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://authzsvc.com/terms
servers:
  - url: http://localhost:8080
    description: Development server
  - url: https://auth.yourdomain.com
    description: Production server
  - url: http://localhost:8000
    description: Envoy proxy (external authorization)

tags:
  - name: Authentication
    description: User authentication endpoints (register, login, logout)
  - name: OTP Verification
    description: SMS OTP generation and verification
  - name: Token Management
    description: JWT token refresh and validation
  - name: User Management
    description: User profile and account management
  - name: Admin - Policies
    description: RBAC policy management (admin only)
  - name: External Authorization
    description: Envoy external authorization integration
  - name: Password Management
    description: Password change and recovery operations
  - name: Health & Monitoring
    description: Health checks and service monitoring

paths:
  # ===== AUTHENTICATION ENDPOINTS =====
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register new user
      description: |
        Register a new user with email, phone, and password. 
        
        **Phone verification required** before login is allowed.
        
        **Default role**: `user` (can be overridden by providing role field)
        
        **Rate limiting**: 10 requests per hour per IP
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              basic_user:
                summary: Basic user registration (with optional role)
                value:
                  email: "user@example.com"
                  password: "SecurePass123!"
                  phone: "+1234567890"
                  role: "user"
              admin_user:
                summary: Admin user registration
                value:
                  email: "admin@example.com"
                  password: "AdminPass123!"
                  phone: "+1234567891"
                  role: "admin"
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "User registered successfully. Please verify your phone number."
                      user_id:
                        type: integer
                        example: 1
              examples:
                success:
                  summary: Successful registration
                  value:
                    data:
                      message: "User registered successfully. Please verify your phone number."
                      user_id: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "User already exists"
                code: 409
                timestamp: "2024-01-15T10:30:00Z"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      tags: [Authentication]
      summary: User login (CB-194 Enhanced - Email OR Phone)
      description: |
        Authenticate user with email OR phone number and receive JWT tokens.
        
        **CB-194 Features**:
        - **Unified authentication**: Use email OR phone number
        - **Smart detection**: Automatically detects identifier type
        - **Backward compatible**: Legacy email field still supported
        - **Enhanced context**: Response includes authentication method used
        
        **Requirements**:
        - Valid email/phone and password
        - Phone number must be verified (for phone auth)
        - Account must be active
        
        **Returns**:
        - Access token (15min TTL)
        - Refresh token (7 days TTL)  
        - User profile information
        - Authentication context (method, normalized identifier)
        
        **Rate limiting**: 5 requests per 5 minutes per identifier
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              email_legacy:
                summary: Legacy email authentication (still supported)
                value:
                  email: "user@example.com"
                  password: "SecurePass123!"
              email_unified:
                summary: Email authentication via identifier field (CB-194)
                value:
                  identifier: "user@example.com"
                  password: "SecurePass123!"
              phone_unified:
                summary: Phone authentication via identifier field (CB-194)
                value:
                  identifier: "+1234567890"
                  password: "SecurePass123!"
              phone_no_country_code:
                summary: Phone without country code (defaults to +1)
                value:
                  identifier: "2345678901"
                  password: "SecurePass123!"
              backward_compatibility:
                summary: Email takes precedence when both fields provided
                value:
                  email: "priority@example.com"
                  identifier: "ignored@example.com"
                  password: "SecurePass123!"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthResult'
              examples:
                user_success:
                  summary: Successful user login
                  value:
                    data:
                      access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      token_type: "Bearer"
                      expires_in: 900
                      user:
                        id: 1
                        email: "user@example.com"
                        role: "user"
                admin_success:
                  summary: Successful admin login
                  value:
                    data:
                      access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      token_type: "Bearer"
                      expires_in: 900
                      user:
                        id: 2
                        email: "admin@example.com"
                        role: "admin"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_credentials:
                  summary: Wrong email or password
                  value:
                    error: "Invalid credentials"
                    code: 401
                    timestamp: "2024-01-15T10:30:00Z"
        '403':
          description: Account inactive or phone not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                account_inactive:
                  summary: Account is inactive
                  value:
                    error: "Account is inactive"
                    code: 403
                    timestamp: "2024-01-15T10:30:00Z"
                phone_not_verified:
                  summary: Phone number not verified
                  value:
                    error: "Phone number not verified"
                    code: 403
                    timestamp: "2024-01-15T10:30:00Z"
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: User logout
      description: |
        Logout user and invalidate session.
        
        **Actions performed**:
        - Invalidate current session in Redis
        - Access token becomes unusable
        - Refresh token becomes unusable
        
        **Note**: Client should discard stored tokens
      operationId: logoutUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "Logged out successfully"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/me:
    get:
      tags: [User Management]
      summary: Get current user profile
      description: |
        Get authenticated user's profile information.
        
        **Returns**:
        - Complete user profile
        - Account status
        - Phone verification status
        - Timestamps
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserProfile'
              examples:
                user_profile:
                  summary: User profile
                  value:
                    data:
                      id: 1
                      email: "user@example.com"
                      phone: "+1234567890"
                      role: "user"
                      is_active: true
                      phone_verified: true
                      created_at: "2024-01-15T10:30:00Z"
                      updated_at: "2024-01-15T10:35:00Z"
                admin_profile:
                  summary: Admin profile
                  value:
                    data:
                      id: 2
                      email: "admin@example.com"
                      phone: "+1234567891"
                      role: "admin"
                      is_active: true
                      phone_verified: true
                      created_at: "2024-01-15T09:00:00Z"
                      updated_at: "2024-01-15T09:00:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "User not found"
                code: 404
                timestamp: "2024-01-15T10:30:00Z"
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===== OTP VERIFICATION ENDPOINTS =====
  /auth/otp/send:
    post:
      tags: [OTP Verification]
      summary: Send OTP to phone
      description: |
        Generate and send OTP code via SMS to user's phone number.
        
        **Requirements**:
        - Valid user ID and phone number
        - Phone number must match user's registered phone
        - User must exist in system
        
        **Rate limiting**: 3 requests per hour per phone number
        
        **OTP properties**:
        - 6-digit numeric code (configurable)
        - 5-minute expiration (configurable)
        - Maximum 5 verification attempts
        - 60-second resend window
      operationId: sendOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPSendRequest'
            examples:
              send_otp:
                summary: Send OTP to user
                value:
                  phone: "+1234567890"
                  user_id: 1
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "OTP sent successfully"
        '400':
          description: Invalid request or phone number mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                phone_mismatch:
                  summary: Phone number doesn't match user
                  value:
                    error: "Phone number does not match user"
                    code: 400
                    timestamp: "2024-01-15T10:30:00Z"
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "User not found"
                code: 404
                timestamp: "2024-01-15T10:30:00Z"
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/otp/verify:
    post:
      tags: [OTP Verification]
      summary: Verify OTP code
      description: |
        Verify OTP code and activate user's phone number.
        
        **Requirements**:
        - Valid user ID, phone number, and OTP code
        - Phone number must match user's registered phone
        - OTP must not be expired
        - Must not exceed maximum attempts
        
        **On success**:
        - Phone number is marked as verified
        - User can now login
        - OTP is invalidated
        
        **Audit logging**: All verification attempts are logged
      operationId: verifyOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
            examples:
              verify_otp:
                summary: Verify OTP code
                value:
                  phone: "+1234567890"
                  code: "123456"
                  user_id: 1
      responses:
        '200':
          description: OTP verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "Phone number verified and activated successfully"
                      user_id:
                        type: integer
                        example: 1
        '400':
          description: Invalid OTP or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_otp:
                  summary: Invalid OTP code
                  value:
                    error: "Invalid OTP code"
                    code: 400
                    timestamp: "2024-01-15T10:30:00Z"
                expired_otp:
                  summary: OTP has expired
                  value:
                    error: "OTP has expired"
                    code: 400
                    timestamp: "2024-01-15T10:30:00Z"
                phone_mismatch:
                  summary: Phone number doesn't match
                  value:
                    error: "Phone number does not match user"
                    code: 400
                    timestamp: "2024-01-15T10:30:00Z"
        '404':
          description: OTP not found or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                otp_not_found:
                  summary: OTP not found
                  value:
                    error: "OTP not found"
                    code: 404
                    timestamp: "2024-01-15T10:30:00Z"
                user_not_found:
                  summary: User not found
                  value:
                    error: "User not found"
                    code: 404
                    timestamp: "2024-01-15T10:30:00Z"
        '429':
          description: Maximum attempts exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Maximum attempts exceeded"
                code: 429
                timestamp: "2024-01-15T10:30:00Z"
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===== TOKEN MANAGEMENT ENDPOINTS =====
  /auth/refresh:
    post:
      tags: [Token Management]
      summary: Refresh JWT tokens
      description: |
        Refresh access token using refresh token.
        
        **Security features (CB-179)**:
        - **Token rotation**: New refresh token issued on each refresh
        - **Session validation**: Ensures session exists in Redis
        - **User status check**: Verifies user is still active
        - **Old tokens invalidated**: Previous tokens become unusable
        
        **Token properties**:
        - Access token: 15 minutes TTL (configurable)
        - Refresh token: 7 days TTL (configurable)
        - Unique JWT ID (jti) for each token
      operationId: refreshTokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            examples:
              refresh_tokens:
                summary: Refresh JWT tokens
                value:
                  refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        description: New access token
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      refresh_token:
                        type: string
                        description: New refresh token (CB-179 security rotation)
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      token_type:
                        type: string
                        example: "Bearer"
                      expires_in:
                        type: integer
                        description: Access token TTL in seconds
                        example: 900
              examples:
                refresh_success:
                  summary: Successful token refresh
                  value:
                    data:
                      access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      token_type: "Bearer"
                      expires_in: 900
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_token:
                  summary: Invalid refresh token
                  value:
                    error: "Invalid or expired refresh token"
                    code: 401
                    timestamp: "2024-01-15T10:30:00Z"
                session_expired:
                  summary: Session expired
                  value:
                    error: "Session expired"
                    code: 401
                    timestamp: "2024-01-15T10:30:00Z"
                user_inactive:
                  summary: User account inactive
                  value:
                    error: "User account is inactive"
                    code: 401
                    timestamp: "2024-01-15T10:30:00Z"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/verify:
    get:
      tags: [Token Management]
      summary: Verify JWT token for external services
      description: |
        **Token verification endpoint for microservices integration**
        
        Validates JWT access tokens and returns token information. 
        This endpoint is designed for external services to verify user authentication.
        
        **Features**:
        - JWT token signature validation
        - Token expiration checking  
        - Session existence verification in Redis
        - User-session ownership validation
        - Comprehensive error codes for different failure scenarios
        
        **Use Cases**:
        - Microservices token validation
        - API gateway authentication
        - Service-to-service authentication verification
        - External authorization checks
        
        **Security**: Does not require additional middleware - validates itself
      operationId: verifyToken
      security:
        - BearerAuth: []
      parameters:
        - name: Authorization
          in: header
          required: true
          description: "Bearer token to verify"
          schema:
            type: string
            example: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: true
                  token_type:
                    type: string
                    example: "access_token"
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: User ID from token claims
                        example: 4684
                      role:
                        type: string
                        description: User role from token claims
                        example: "user"
                      session_id:
                        type: string
                        description: Session ID from token claims
                        example: "sess_4684_123456789"
                      issued_at:
                        type: integer
                        description: Token issued timestamp (Unix)
                        example: 1758811485
                      expires_at:
                        type: integer
                        description: Token expiration timestamp (Unix)
                        example: 1758812385
              examples:
                valid_token_with_session:
                  summary: Valid token with session
                  value:
                    valid: true
                    token_type: "access_token"
                    user:
                      id: 4684
                      role: "user"
                      session_id: "sess_4684_123456789"
                      issued_at: 1758811485
                      expires_at: 1758812385
                valid_token_no_session:
                  summary: Valid token without session
                  value:
                    valid: true
                    token_type: "access_token"
                    user:
                      id: 1234
                      role: "admin"
                      session_id: ""
                      issued_at: 1758811400
                      expires_at: 1758812300
        '400':
          description: Bad request - missing or invalid Authorization header
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: false
                  error:
                    type: string
                    description: Error description
                  error_code:
                    type: string
                    description: Machine-readable error code
              examples:
                missing_header:
                  summary: Missing Authorization header
                  value:
                    valid: false
                    error: "Authorization header required"
                    error_code: "MISSING_AUTHORIZATION_HEADER"
                invalid_format:
                  summary: Invalid header format
                  value:
                    valid: false
                    error: "Invalid authorization header format"
                    error_code: "INVALID_AUTHORIZATION_FORMAT"
        '401':
          description: Token is invalid, expired, or session issues
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: false
                  error:
                    type: string
                    description: Error description
                  error_code:
                    type: string
                    description: Machine-readable error code
              examples:
                token_expired:
                  summary: Token has expired
                  value:
                    valid: false
                    error: "Token expired"
                    error_code: "TOKEN_EXPIRED"
                token_invalid:
                  summary: Token is invalid
                  value:
                    valid: false
                    error: "Token invalid"
                    error_code: "TOKEN_INVALID"
                token_malformed:
                  summary: Token is malformed
                  value:
                    valid: false
                    error: "Token malformed"
                    error_code: "TOKEN_MALFORMED"
                session_invalid:
                  summary: Session not found or expired
                  value:
                    valid: false
                    error: "Session invalid or expired"
                    error_code: "SESSION_INVALID"
                session_user_mismatch:
                  summary: Session belongs to different user
                  value:
                    valid: false
                    error: "Session user mismatch"
                    error_code: "SESSION_USER_MISMATCH"
                session_expired:
                  summary: Session has expired
                  value:
                    valid: false
                    error: "Session expired"
                    error_code: "SESSION_EXPIRED"
                validation_failed:
                  summary: General validation failure
                  value:
                    valid: false
                    error: "Token validation failed"
                    error_code: "TOKEN_VALIDATION_FAILED"
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===== PASSWORD MANAGEMENT ENDPOINTS =====
  /password/change:
    post:
      tags: [Password Management]
      summary: Initiate password change
      description: |
        Start a password change process for authenticated users.
        
        **Requires authentication**
        
        **OTP verification required** before password change is completed.
        
        **Rate limiting**: 5 requests per hour per user
      operationId: initiatePasswordChange
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
                - confirm_password
              properties:
                current_password:
                  type: string
                  description: Current password for verification
                  example: "CurrentPass123!"
                new_password:
                  type: string
                  description: New password (minimum 8 characters, must include uppercase, lowercase, number, special char)
                  example: "NewSecurePass123!"
                confirm_password:
                  type: string
                  description: Confirm new password (must match new_password)
                  example: "NewSecurePass123!"
            examples:
              password_change:
                summary: Initiate password change
                value:
                  current_password: "CurrentPass123!"
                  new_password: "NewSecurePass123!"
                  confirm_password: "NewSecurePass123!"
      responses:
        '200':
          description: Password change initiated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Password change request ID
                        example: "pc_abc123"
                      status:
                        type: string
                        description: Request status
                        example: "initiated"
                      message:
                        type: string
                        description: Success message
                        example: "Password change initiated. Please check your phone for OTP verification code."
                      expires_at:
                        type: string
                        format: date-time
                        description: Request expiration time
                        example: "2024-01-15T10:35:00Z"
                      nonce:
                        type: string
                        description: Security nonce for request verification
                        example: "abc123def456"
        '400':
          $ref: '#/components/responses/BadRequest'
