                  type: string
                  format: email
                  description: Registered email address
                  example: "user@example.com"
                phone:
                  type: string
                  description: Registered phone number
                  example: "+1234567890"
                  pattern: "^\\+[1-9]\\d{1,14}$"
            examples:
              password_reset:
                summary: Initiate password reset
                value:
                  email: "user@example.com"
                  phone: "+1234567890"
      responses:
        '200':
          description: Password reset initiated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
