  # ===== USER DATA ENDPOINT (DEMO) =====
  /users/{id}:
    get:
      tags: [User Management]
      summary: Get user data (field validation demo)
      description: |
        **Demo endpoint for field validation**
        
        This endpoint demonstrates SimpleCasbinMW field validation where users can only access their own data.
        
        **Policy**: `role_user, /users/:id, GET, path.id==token.user_id`
        
        **Behavior**:
        - ✅ User ID 123 can access `/users/123`
        - ❌ User ID 123 cannot access `/users/456`
        - ✅ Admin can access any user data
        
        **Response**: Simplified user information for demonstration
      operationId: getUserData
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID to retrieve
          schema:
            type: integer
            example: 123
      responses:
        '200':
          description: User data retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User data access successful"
                  requested_user_id:
                    type: string
                    example: "123"
                  current_user_id:
                    type: integer
                    example: 123
                  note:
                    type: string
                    example: "This endpoint demonstrates SimpleCasbinMW field validation"
              examples:
                own_data:
                  summary: User accessing own data
                  value:
                    message: "User data access successful"
                    requested_user_id: "123"
                    current_user_id: 123
                    note: "This endpoint demonstrates SimpleCasbinMW field validation"
                admin_access:
                  summary: Admin accessing any user data
                  value:
                    message: "User data access successful"
                    requested_user_id: "456"
                    current_user_id: 2
                    note: "This endpoint demonstrates SimpleCasbinMW field validation"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Field validation failed - cannot access other user's data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Field validation failed"
                message: "path.id (456) does not match token.user_id (123)"
                code: 403
                timestamp: "2024-01-15T10:30:00Z"
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ===== HEALTH & MONITORING ENDPOINTS =====
  /health:
    get:
      tags: [Health & Monitoring]
      summary: Service health check
      description: |
        General health check endpoint for the authentication service.
        
        **Used by**:
        - Load balancers
        - Kubernetes liveness/readiness probes
        - Monitoring systems
        - Docker health checks
        
        **Response includes**:
        - Service status
        - Timestamp
        - Uptime (if configured)
        - Version (if available)
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
