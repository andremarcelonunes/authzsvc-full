# Minimal Envoy gateway for authzsvc using the HTTP ext_authz filter.
#
#   Client -> Envoy :8000 -> (ext_authz) authzsvc /external/authz/check/<original path> -> backend_service
#
# Envoy calls the authorization service with the ORIGINAL method and the path
# path_prefix + original path (+ query string). The decision comes from the HTTP
# status (200 = allow; anything else = deny, status and body go to the client)
# and identity comes from the response headers listed in allowed_upstream_headers.
#
# Validate with:
#   envoy --mode validate -c envoy-external-authz.yaml
#
# SECURITY: for authorized requests, x-user-id / x-user-role / x-backend-user-id set by authzsvc
# OVERWRITE any client-supplied values of the same name before the request is
# forwarded upstream. Routes that bypass ext_authz (none in this example) do not
# get this protection and the backend must not trust those headers there.
static_resources:
  listeners:
  - name: main_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8000
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: main
          route_config:
            name: local_route
            virtual_hosts:
            - name: backend
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: backend_service }
          http_filters:
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              transport_api_version: V3
              failure_mode_allow: false
              http_service:
                server_uri:
                  uri: "http://authzsvc:8080"
                  cluster: authz_service
                  timeout: 5s
                path_prefix: "/external/authz/check"
                authorization_request:
                  allowed_headers:
                    patterns:
                    - exact: "authorization"
                    - exact: "content-type"
                    - prefix: "x-"
                authorization_response:
                  allowed_upstream_headers:
                    patterns:
                    - exact: "x-user-id"
                    - exact: "x-user-role"
                    - exact: "x-backend-user-id"
              # Optional: lets field rules such as body.author_id==token.user_id work.
              with_request_body:
                max_request_bytes: 8192
                allow_partial_message: true
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  # Placeholder: replace with the real upstream service.
  - name: backend_service
    connect_timeout: 5s
    type: STRICT_DNS
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: backend_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: backend-service.example.internal, port_value: 9000 }
  - name: authz_service
    connect_timeout: 5s
    type: STRICT_DNS
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: authz_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: authzsvc, port_value: 8080 }
